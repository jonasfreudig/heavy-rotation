plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The app's own Last.fm, TIDAL and setlist.fm keys, for builds other people install: they only sign in.
// They come from local.properties, which stays out of git (see README, "Building it yourself");
// without them, everyone enters their own keys in Settings.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def builtIn = { String name -> (localProps.getProperty(name) ?: '').trim().replace('"', '') }
// -PwithoutTidal: a build to hand out before TIDAL has approved the app (docs/DEVELOPING.md) leaves the TIDAL app out.
def tidalBuiltIn = { String name -> project.hasProperty('withoutTidal') ? '' : builtIn(name) }

// Release signing: your own key, described in keystore.properties next to this project's
// settings.gradle (storeFile, storePassword, keyAlias, keyPassword). Stays out of git.
def signing = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'app.recordshelf'
    compileSdk 34

    defaultConfig {
        applicationId "app.recordshelf"
        minSdk 26
        targetSdk 34
        versionCode 67
        versionName "0.67"
        buildConfigField 'String', 'LASTFM_KEY', "\"${builtIn('recordshelf.lastfm.key')}\""
        buildConfigField 'String', 'LASTFM_SECRET', "\"${builtIn('recordshelf.lastfm.secret')}\""
        buildConfigField 'String', 'TIDAL_CLIENT_ID', "\"${tidalBuiltIn('recordshelf.tidal.clientId')}\""
        buildConfigField 'String', 'TIDAL_SECRET', "\"${tidalBuiltIn('recordshelf.tidal.secret')}\""
        buildConfigField 'String', 'SETLISTFM_KEY', "\"${builtIn('recordshelf.setlistfm.key')}\""
    }

    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile rootProject.file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            // Installs next to the release build, as "Heavy Rotation (debug)".
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
